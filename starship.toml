add_newline = false
command_timeout = 1000

format = """$directory$git_branch$character"""

[directory]
style = "bold blue"
truncation_length = 1
truncate_to_repo = true

[git_branch]
format = "[$branch]($style) "
style = "bold magenta"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
